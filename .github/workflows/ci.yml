# Lint · typecheck · test · secret-scan on every PR and push to main.
# Job names are the status-check contexts required by the branch ruleset,
# matching the quynhonsemiconductor/rova convention.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build before typecheck: packages resolve each other via their built
      # dist types (e.g. @quynhonsemiconductor/identity depends on @quynhonsemiconductor/platform-cache).
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # packages/testing starts PostgreSQL 18 and Valkey through the runner's Docker daemon.
      # Fail here, loudly, if the runner image ever stops providing it; the harness itself
      # also throws when CI is set rather than skipping.
      - run: docker version
      # Build first so workspace packages resolve their cross-package imports.
      - run: pnpm build
      - run: pnpm test

  # ── Consumer CI ─────────────────────────────────────────────────────────────
  # Does this pull request break a product? Each product is checked out, pointed at tarballs
  # packed from THIS pull request, and asked to typecheck and run its unit tests. The answer is a
  # native check on the PR; nothing is dispatched to another repository.
  #
  # Tarballs and not the registry: a package that has never been published, or a version that
  # exists only on this branch, installs the same way, and the real version numbers keep every
  # peer range (`>=2.0.0`) satisfiable -- a `-pr.N` prerelease would not satisfy one.
  tarballs:
    name: Pack packages for consumer CI
    # Same-repo pull requests only: a fork has no access to the App credentials below.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/consumer-ci/pack.mjs --out tarballs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: consumer-tarballs
          path: tarballs
          retention-days: 1
          if-no-files-found: error

  consumer:
    name: Consumer · ${{ matrix.product }}
    needs: tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `packages: read` only so `${NODE_AUTH_TOKEN}` in the product's .npmrc resolves; every
    # @quynhonsemiconductor/* dependency comes from the tarballs.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pnpm` is the version each product's own CI pins. Keep it in step with them.
          - { product: rova, pnpm: '10.33.2', unit_tests: true }
          - { product: opshub, pnpm: '10.33.2', unit_tests: true }
          # solodesk's services have no unit tests, only database-backed e2e suites that need
          # Postgres and Valkey; its web apps' tests need a live backend. Typecheck is what
          # can be asserted without infrastructure.
          - { product: solodesk, pnpm: '10.23.0', unit_tests: false }
    steps:
      # Read-only App (contents: read), never the write-capable automation App in a pull-request
      # workflow. The token is used by the checkout below and is not exported to any later step;
      # the action revokes it when the job ends.
      #
      # Scoped to THIS job's product, not to all three: the job needs one repository, and a
      # request naming a repository the App is not installed on fails outright, so the broad form
      # would turn one missing installation into three red jobs with the same message.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: token
        with:
          app-id: ${{ vars.QNSC_REPO_READER_APP_ID }}
          private-key: ${{ secrets.QNSC_REPO_READER_PRIVATE_KEY }}
          repositories: ${{ matrix.product }}
          permission-contents: read

      # Both checkouts go into subdirectories so the workspace root has no package.json: the pnpm
      # setup action would otherwise read THIS repo's `packageManager` and refuse the product's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: platform
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quynhonsemiconductor/${{ matrix.product }}
          token: ${{ steps.token.outputs.token }}
          path: product
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: consumer-tarballs
          path: tarballs

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: '24'
          pnpm-version: ${{ matrix.pnpm }}
          install-deps: 'false'
          working-directory: product

      # Fails if the product depends on none of our packages, so this check cannot go green
      # while testing the registry versions instead of this pull request.
      - name: Point the product at this pull request's packages
        run: node platform/tools/consumer-ci/link.mjs --product product --tarballs "$GITHUB_WORKSPACE/tarballs"

      # `--no-frozen-lockfile`: the specifiers just changed, so the committed lockfile is
      # intentionally out of date. The rewritten lockfile stays in this throwaway checkout.
      - name: Install
        working-directory: product
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: product
        run: pnpm typecheck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        if: matrix.unit_tests
        working-directory: product
        run: pnpm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `CI required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  #
  # `consumer` is deliberately NOT in `needs` yet: it joins after it has been green on three
  # consecutive pull requests. Two things to settle first. The gate asserts a positive `success`
  # from every dependency, so a SKIPPED job fails it -- and `tarballs`/`consumer` skip on pushes
  # to main and on fork PRs (no App credentials there). Either give the gate an
  # `if: github.event_name == 'pull_request'` variant of that list, or run the consumers on
  # push as well, before adding them.
  ci-required:
    name: CI required
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ join(needs.*.result, ',') }}
